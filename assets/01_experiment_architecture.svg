<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<style>.t{font:700 48px Inter,Arial;fill:#0f172a}.s{font:400 23px Inter,Arial;fill:#475569}.h{font:700 25px Inter,Arial;fill:#0f172a}.b{font:500 20px Inter,Arial;fill:#334155}.w{font:700 20px Inter,Arial;fill:#fff}.line{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1800" height="950" fill="#ffffff"/>
<text x="80" y="80" class="t">Experiment flow: from 32 local batches to equivalent ZeRO updates</text>
<text x="80" y="124" class="s">The computation remains data-parallel; ZeRO changes persistent ownership and collective communication.</text>
<rect x="80" y="220" width="250" height="125" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="205" y="265" text-anchor="middle" class="h">Input data</text><text x="205" y="305" text-anchor="middle" class="b">32 different local batches</text>
<rect x="420" y="190" width="300" height="185" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="570" y="235" text-anchor="middle" class="h">32 virtual ranks</text><text x="570" y="275" text-anchor="middle" class="b">forward → loss → backward</text><text x="570" y="315" text-anchor="middle" class="b">one local gradient / rank</text><path d="M330 282 H410" class="line"/>
<rect x="810" y="190" width="300" height="185" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="960" y="235" text-anchor="middle" class="h">Gradient synchronization</text><text x="960" y="275" text-anchor="middle" class="b">All-Reduce</text><text x="960" y="315" text-anchor="middle" class="b">or Reduce-Scatter + All-Gather</text><path d="M720 282 H800" class="line"/>
<text x="1180" y="180" class="h">Same averaged gradient, four ownership strategies</text><g><rect x="1180" y="215" width="270" height="115" rx="16" fill="#fee2e2"/><text x="1315" y="255" text-anchor="middle" class="h">Data Parallel</text><text x="1315" y="293" text-anchor="middle" class="b">P + G + O replicated</text><rect x="1480" y="215" width="240" height="115" rx="16" fill="#fef3c7"/><text x="1600" y="255" text-anchor="middle" class="h">ZeRO-1</text><text x="1600" y="293" text-anchor="middle" class="b">O sharded</text><rect x="1180" y="365" width="270" height="115" rx="16" fill="#dcfce7"/><text x="1315" y="405" text-anchor="middle" class="h">ZeRO-2</text><text x="1315" y="443" text-anchor="middle" class="b">G + O sharded</text><rect x="1480" y="365" width="240" height="115" rx="16" fill="#ede9fe"/><text x="1600" y="405" text-anchor="middle" class="h">ZeRO-3</text><text x="1600" y="443" text-anchor="middle" class="b">P + G + O sharded</text></g><path d="M1110 282 H1165" class="line"/>
<rect x="650" y="570" width="500" height="135" rx="22" fill="#0f172a"/><text x="900" y="620" text-anchor="middle" class="w">Adam update</text><text x="900" y="660" text-anchor="middle" class="w">same equations · same initial weights · same data</text><path d="M1450 480 C1450 545 1180 625 1165 625" class="line"/><path d="M1600 480 C1600 600 1190 660 1165 660" class="line"/>
<rect x="500" y="790" width="800" height="95" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="900" y="830" text-anchor="middle" class="h">Correctness result</text><text x="900" y="865" text-anchor="middle" class="b">DP, ZeRO-1, ZeRO-2 and ZeRO-3 converge to the same parameter vector</text><path d="M900 705 V775" class="line"/>
<rect x="80" y="560" width="410" height="150" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="285" y="605" text-anchor="middle" class="h">Failure experiment</text><text x="285" y="645" text-anchor="middle" class="b">remove gradient synchronization</text><text x="285" y="680" text-anchor="middle" class="b">→ replicas diverge ≈ 0.02</text><path d="M570 375 C500 450 350 500 285 545" class="line"/>
</svg>