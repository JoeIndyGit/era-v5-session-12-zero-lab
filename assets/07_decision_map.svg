<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.s{font-size:18px;fill:#475569}.h{font-size:17px;font-weight:700}.pt1{fill:#2563eb}.pt2{fill:#7c3aed}</style><rect width="1100" height="620" fill="#fff"/><text x="55" y="58" class="t">Memory headroom versus communication cost</text><text x="55" y="92" class="s">The practical choice is a trade-off, not “highest ZeRO stage wins.”</text><line x1="120" y1="500" x2="1000" y2="500" stroke="#475569" stroke-width="2"/><line x1="120" y1="500" x2="120" y2="150" stroke="#475569" stroke-width="2"/><text x="560" y="565" text-anchor="middle" class="s">Approx. communication per rank per step (GB)</text><text x="35" y="330" transform="rotate(-90 35 330)" text-anchor="middle" class="s">State headroom on 74.5 GiB GPU (GiB)</text><g class="s"><text x="315" y="525">120</text><text x="760" y="525">180</text><text x="80" y="440">5</text><text x="72" y="300">12</text><text x="72" y="180">20</text></g><line x1="330" y1="500" x2="330" y2="165" stroke="#e2e8f0"/><line x1="780" y1="500" x2="780" y2="165" stroke="#e2e8f0"/><line x1="120" y1="400" x2="1000" y2="400" stroke="#e2e8f0"/><line x1="120" y1="260" x2="1000" y2="260" stroke="#e2e8f0"/><circle cx="330" cy="390" r="18" class="pt1"/><text x="360" y="382" class="h">ZeRO-2 · 32 ranks</text><text x="360" y="410" class="s">~68.1 GiB state · ~6.4 GiB headroom · ~2P</text><circle cx="780" cy="220" r="18" class="pt2"/><text x="810" y="212" class="h">ZeRO-3 · 8 ranks</text><text x="810" y="240" class="s">~55.9 GiB state · ~18.6 GiB headroom · ~3P</text><rect x="150" y="115" width="800" height="52" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="550" y="148" text-anchor="middle" class="h">Decision rule: use the lowest stage with enough real headroom, then measure overlap and step time.</text></svg>