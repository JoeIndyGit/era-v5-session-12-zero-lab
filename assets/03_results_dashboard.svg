<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920"><style>.t{font:700 48px Inter,Arial;fill:#0f172a}.s{font:400 23px Inter,Arial;fill:#475569}.h{font:700 29px Inter,Arial;fill:#0f172a}.n{font:800 46px Inter,Arial;fill:#0f172a}.b{font:500 21px Inter,Arial;fill:#334155}.ok{font:700 22px Inter,Arial;fill:#166534}.no{font:700 22px Inter,Arial;fill:#991b1b}</style><rect width="1800" height="920" fill="#fff"/><text x="80" y="80" class="t">Results dashboard · 30B parameters · 32 ranks</text><text x="80" y="126" class="s">Persistent training state uses the session's 16 bytes/parameter mixed-precision Adam accounting.</text><g transform="translate(80,190)"><rect width="380" height="250" rx="22" fill="#fef2f2"/><text x="28" y="55" class="h">Data Parallel</text><text x="28" y="120" class="n">447.0 GiB</text><text x="28" y="158" class="b">per rank</text><text x="28" y="205" class="no">DOES NOT FIT</text><text x="240" y="205" class="b">~2P</text></g><g transform="translate(490,190)"><rect width="380" height="250" rx="22" fill="#fff7ed"/><text x="28" y="55" class="h">ZeRO-1</text><text x="28" y="120" class="n">122.2 GiB</text><text x="28" y="158" class="b">per rank</text><text x="28" y="205" class="no">DOES NOT FIT</text><text x="240" y="205" class="b">~2P</text></g><g transform="translate(900,190)"><rect width="380" height="250" rx="22" fill="#f0fdf4"/><text x="28" y="55" class="h">ZeRO-2</text><text x="28" y="120" class="n">68.1 GiB</text><text x="28" y="158" class="b">per rank</text><text x="28" y="205" class="ok">FITS</text><text x="240" y="205" class="b">~2P</text></g><g transform="translate(1310,190)"><rect width="380" height="250" rx="22" fill="#eef2ff"/><text x="28" y="55" class="h">ZeRO-3</text><text x="28" y="120" class="n">14.0 GiB</text><text x="28" y="158" class="b">per rank</text><text x="28" y="205" class="ok">FITS</text><text x="240" y="205" class="b">~3P</text></g><g transform="translate(80,520)"><rect width="510" height="245" rx="22" fill="#f8fafc" stroke="#cbd5e1"/><text x="28" y="55" class="h">Collective identity</text><text x="28" y="120" class="n">0.0</text><text x="28" y="160" class="b">max numerical difference</text><text x="28" y="205" class="b">All-Reduce = Reduce-Scatter + All-Gather</text></g><g transform="translate(645,520)"><rect width="510" height="245" rx="22" fill="#f8fafc" stroke="#cbd5e1"/><text x="28" y="55" class="h">Optimizer equivalence</text><text x="28" y="120" class="n">MATCH</text><text x="28" y="160" class="b">DP = Z1 = Z2 = Z3</text><text x="28" y="205" class="b">same Adam trajectory within tolerance</text></g><g transform="translate(1210,520)"><rect width="510" height="245" rx="22" fill="#fff7ed" stroke="#fdba74"/><text x="28" y="55" class="h">Broken sync experiment</text><text x="28" y="120" class="n">≈ 0.02</text><text x="28" y="160" class="b">replica divergence after one step</text><text x="28" y="205" class="b">synchronization is correctness</text></g><text x="900" y="855" text-anchor="middle" class="h">ZeRO saves memory by removing persistent duplication — not by changing the optimizer mathematics.</text></svg>