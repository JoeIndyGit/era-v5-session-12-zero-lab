<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
<style>.t{font:700 48px Inter,Arial;fill:#0f172a}.s{font:400 24px Inter,Arial;fill:#475569}.h{font:700 25px Inter,Arial;fill:#0f172a}.b{font:600 22px Inter,Arial;fill:#0f172a}.sm{font:500 19px Inter,Arial;fill:#334155}</style><rect width="1800" height="920" fill="#fff"/><text x="80" y="80" class="t">What ZeRO actually shards</text><text x="80" y="126" class="s">Persistent state ownership at world size 32. Replicated means every rank stores the full tensor; sharded means each rank keeps roughly 1/32.</text><text x="330" y="230" text-anchor="middle" class="h">Parameters</text><text x="610" y="230" text-anchor="middle" class="h">Gradients</text><text x="890" y="230" text-anchor="middle" class="h">FP32 master</text><text x="1170" y="230" text-anchor="middle" class="h">Adam m</text><text x="1450" y="230" text-anchor="middle" class="h">Adam v</text><g class="b"><text x="80" y="330">Data Parallel</text><text x="80" y="455">ZeRO-1</text><text x="80" y="580">ZeRO-2</text><text x="80" y="705">ZeRO-3</text></g><g><rect x="210" y="275" width="240" height="80" rx="14" fill="#fee2e2"/><rect x="490" y="275" width="240" height="80" rx="14" fill="#fee2e2"/><rect x="770" y="275" width="240" height="80" rx="14" fill="#fee2e2"/><rect x="1050" y="275" width="240" height="80" rx="14" fill="#fee2e2"/><rect x="1330" y="275" width="240" height="80" rx="14" fill="#fee2e2"/><rect x="210" y="400" width="240" height="80" rx="14" fill="#fee2e2"/><rect x="490" y="400" width="240" height="80" rx="14" fill="#fee2e2"/><rect x="770" y="400" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="1050" y="400" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="1330" y="400" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="210" y="525" width="240" height="80" rx="14" fill="#fee2e2"/><rect x="490" y="525" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="770" y="525" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="1050" y="525" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="1330" y="525" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="210" y="650" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="490" y="650" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="770" y="650" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="1050" y="650" width="240" height="80" rx="14" fill="#dbeafe"/><rect x="1330" y="650" width="240" height="80" rx="14" fill="#dbeafe"/></g><g text-anchor="middle" class="sm"><text x="330" y="325">FULL × 32</text><text x="610" y="325">FULL × 32</text><text x="890" y="325">FULL × 32</text><text x="1170" y="325">FULL × 32</text><text x="1450" y="325">FULL × 32</text><text x="330" y="450">FULL × 32</text><text x="610" y="450">FULL × 32</text><text x="890" y="450">1 / 32</text><text x="1170" y="450">1 / 32</text><text x="1450" y="450">1 / 32</text><text x="330" y="575">FULL × 32</text><text x="610" y="575">1 / 32</text><text x="890" y="575">1 / 32</text><text x="1170" y="575">1 / 32</text><text x="1450" y="575">1 / 32</text><text x="330" y="700">1 / 32</text><text x="610" y="700">1 / 32</text><text x="890" y="700">1 / 32</text><text x="1170" y="700">1 / 32</text><text x="1450" y="700">1 / 32</text></g><rect x="210" y="800" width="270" height="55" rx="12" fill="#fee2e2"/><text x="345" y="836" text-anchor="middle" class="sm">Replicated</text><rect x="515" y="800" width="270" height="55" rx="12" fill="#dbeafe"/><text x="650" y="836" text-anchor="middle" class="sm">Sharded</text><text x="860" y="835" class="sm">Memory/rank: 16 B → 4.375 B → 2.4375 B → 0.5 B per parameter</text></svg>