<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.t{font-size:36px;font-weight:700}.s{font-size:18px;fill:#475569}.r{font-size:14px;font-weight:700}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.sync{fill:#f8fafc;stroke:#475569;stroke-width:2}</style><rect width="1200" height="620" fill="#fff"/><text x="55" y="62" class="t">32 virtual GPUs / ranks</text><text x="55" y="96" class="s">Each rank sees a different local batch; collective synchronization creates one global-batch optimizer step.</text><g id="ranks">