<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.s{font-size:18px;fill:#475569}.h{font-size:17px;font-weight:700}.v{font-size:18px;font-weight:700}.legend{font-size:15px}</style><rect width="1200" height="700" fill="#fff"/><text x="55" y="58" class="t">Where the 16 bytes/parameter go as ZeRO removes redundancy</text><text x="55" y="92" class="s">Persistent bytes on one rank at world size 32.</text><line x1="90" y1="585" x2="1120" y2="585" stroke="#94a3b8" stroke-width="2"/><g><rect x="150" y="185" width="150" height="400" fill="#e2e8f0"/><rect x="150" y="135" width="150" height="50" fill="#cbd5e1"/><rect x="150" y="85" width="150" height="50" fill="#93c5fd"/><rect x="150" y="35" width="150" height="50" fill="#60a5fa" transform="translate(0 50)"/></g><text x="225" y="620" text-anchor="middle" class="h">Data Parallel</text><text x="225" y="160" text-anchor="middle" class="v">16 B</text><g><rect x="390" y="475" width="150" height="110" fill="#e2e8f0"/><rect x="390" y="425" width="150" height="50" fill="#93c5fd"/><rect x="390" y="375" width="150" height="50" fill="#60a5fa"/></g><text x="465" y="620" text-anchor="middle" class="h">ZeRO-1</text><text x="465" y="360" text-anchor="middle" class="v">4.375 B</text><g><rect x="630" y="520" width="150" height="65" fill="#e2e8f0"/><rect x="630" y="495" width="150" height="25" fill="#93c5fd"/><rect x="630" y="470" width="150" height="25" fill="#60a5fa"/></g><text x="705" y="620" text-anchor="middle" class="h">ZeRO-2</text><text x="705" y="455" text-anchor="middle" class="v">2.4375 B</text><g><rect x="870" y="560" width="150" height="25" fill="#60a5fa"/></g><text x="945" y="620" text-anchor="middle" class="h">ZeRO-3</text><text x="945" y="545" text-anchor="middle" class="v">0.5 B</text><g transform="translate(810 120)"><rect width="18" height="18" fill="#60a5fa"/><text x="28" y="15" class="legend">Parameters</text><rect y="30" width="18" height="18" fill="#93c5fd"/><text x="28" y="45" class="legend">Gradients</text><rect y="60" width="18" height="18" fill="#e2e8f0"/><text x="28" y="75" class="legend">FP32 master + Adam moments</text></g><text x="55" y="675" class="s">The exact accounting is 2 B parameters + 2 B gradients + 4 B FP32 master + 4 B Adam m + 4 B Adam v.</text></svg>