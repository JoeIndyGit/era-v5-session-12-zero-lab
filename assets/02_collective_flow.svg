<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:700}.s{font-size:18px;fill:#475569}.h{font-size:20px;font-weight:700}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.sh{fill:#dbeafe;stroke:#2563eb;stroke-width:1}</style><rect width="1400" height="520" fill="#fff"/><text x="55" y="60" class="t">Collective identity used by Data Parallel and ZeRO</text><text x="55" y="95" class="s">All-Reduce = Reduce-Scatter + All-Gather</text><g transform="translate(55 165)"><rect width="250" height="150" rx="18" class="box"/><text x="125" y="48" text-anchor="middle" class="h">32 local gradients</text><text x="125" y="82" text-anchor="middle" class="s">one per rank</text><text x="125" y="114" text-anchor="middle" class="s">different because data differs</text></g><path d="M320 240 H410" stroke="#475569" stroke-width="4"/><polygon points="410,240 392,229 392,251" fill="#475569"/><g transform="translate(420 165)"><rect width="260" height="150" rx="18" class="box"/><text x="130" y="48" text-anchor="middle" class="h">Reduce-Scatter</text><text x="130" y="82" text-anchor="middle" class="s">average contributions</text><text x="130" y="114" text-anchor="middle" class="s">keep 1/32 shard per rank</text></g><path d="M695 240 H785" stroke="#475569" stroke-width="4"/><polygon points="785,240 767,229 767,251" fill="#475569"/><g transform="translate(795 165)"><rect width="240" height="150" rx="18" class="sh"/><text x="120" y="48" text-anchor="middle" class="h">Owned shards</text><text x="120" y="82" text-anchor="middle" class="s">rank 0 … rank 31</text><text x="120" y="114" text-anchor="middle" class="s">averaged gradient slices</text></g><path d="M1050 240 H1135" stroke="#475569" stroke-width="4"/><polygon points="1135,240 1117,229 1117,251" fill="#475569"/><g transform="translate(1145 165)"><rect width="200" height="150" rx="18" class="box"/><text x="100" y="48" text-anchor="middle" class="h">All-Gather</text><text x="100" y="82" text-anchor="middle" class="s">reconstruct full</text><text x="100" y="114" text-anchor="middle" class="s">averaged result</text></g><text x="700" y="405" text-anchor="middle" class="h">Notebook numerical check: max difference = 0.0</text><text x="700" y="445" text-anchor="middle" class="s">This equivalence is why ZeRO-2 can retain only the gradient shard each owner rank needs.</text></svg>